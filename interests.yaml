profile:
  description: >
    Systems PhD research on (1) empirical performance measurement, variability,
    reproducibility, and statistical methodology for systems experiments,
    (2) confidential computing, verifiable trust, and privacy-preserving systems,
    and (3) cloud & HPC security, multi-tenant workload isolation, and trusted execution environments.

clusters:
  - name: performance-variability
    weight: 1.0
    keywords: [performance variability, reproducibility, replicability, measurement bias,
               statistical methodology, benchmarking, experiment design, hardware heterogeneity,
               performance regression, variance]
  - name: confidential-computing
    weight: 1.0
    keywords: [trusted execution environment, TEE, Intel TDX, AMD SEV-SNP, SGX, Gramine,
               remote attestation, confidential VM, enclave, confidential computing, confidential GPU]
  - name: cloud-and-hpc-security
    weight: 1.0
    keywords: [cloud security, HPC security, supercomputing security, multi-tenant isolation,
               hypervisor security, microVM, Firecracker, container security, MPI security,
               RDMA security, InfiniBand security, Slurm security, serverless security, confidential cloud]
  - name: verifiable-trust-and-attestation
    weight: 1.0
    keywords: [remote attestation, hardware root of trust, TPM, confidential VM attestation,
               trusted execution environment, trusted computing base, systems integrity verification,
               enclave attestation, verifiable systems, confidential computing privacy]
  - name: testbeds
    weight: 0.8
    keywords: [CloudLab, Chameleon, testbed, artifact evaluation, experiment automation]
  - name: adjacent
    weight: 0.4
    keywords: [5G core, storage performance, ML systems performance, tail latency, profiling]

downrank:
  - pure or theoretical cryptography (proof systems, zero-knowledge proofs without systems evaluation, cipher design, signature math)
  - blockchain, cryptocurrency, web3, and smart contracts
  - quantum computing
  - pure machine learning, NLP, or computer vision architectures (unless focused on systems performance, testbeds, or confidential AI)
  - theoretical network routing without systems, cloud, or HPC focus

venues:
  top: [OSDI, SOSP, EuroSys, ASPLOS, NSDI, SIGMETRICS, USENIX ATC, FAST,
        IEEE S&P, USENIX Security, CCS, NDSS, PETS, SoCC, SC, HPDC]
  workshops: [SysTEX, HASP, CSET, HotOS, P-RECS, ACM REP, IPDPS, ICS, HotCloud, HotStorage]

seed_papers:
  - "Taming Performance Variability"
  - "The Design and Operation of CloudLab"

arxiv_categories: [cs.OS, cs.DC, cs.PF, cs.CR, cs.AR]

